# HRMS Pro — host Nginx for hr.syntrax.co.tz
# Install on VPS:
#   sudo cp nginx/host/hr.syntrax.co.tz.conf /etc/nginx/sites-available/hr.syntrax.co.tz
#   sudo ln -sf /etc/nginx/sites-available/hr.syntrax.co.tz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hr.syntrax.co.tz
#
# Docker web must listen on 127.0.0.1:8020 (see docker-compose.prod.yml).

upstream hrms_web_upstream {
    server 127.0.0.1:8020;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name hr.syntrax.co.tz;

    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        proxy_pass http://hrms_web_upstream;
        proxy_set_header Host $host;
        expires 30d;
    }

    location /media/ {
        proxy_pass http://hrms_web_upstream;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://hrms_web_upstream;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /healthz {
        access_log off;
        return 200 "hrms ok\n";
        add_header Content-Type text/plain;
    }
}
